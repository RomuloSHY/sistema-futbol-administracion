<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Asistencia</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/asistencia.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">⚽ Registrar Asistencia</h2>

    <div class="mb-3 text-end">
        <button id="btn-cargar" class="btn btn-primary">🔄 Cargar Jugadores Activos</button>
    </div>

    <table class="table table-hover table-striped">
        <thead class="table-dark text-center">
        <tr>
            <th>Nombre</th>
            <th>Asistencia</th>
        </tr>
        </thead>
        <tbody id="tabla-jugadores-activos"></tbody>
    </table>

    <div class="d-flex justify-content-between mt-3">

        <a href="index.html" class="btn btn-secondary">
            ⬅ Volver al Menú Principal
        </a>

        <button id="btn-registrar" class="btn btn-success">
            Registrar Asistencia
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/asistencia.js"></script>

</body>
</html>
