<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Fútbol Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">⚽ Lista de Jugadores</h2>

    <!-- BOTONES -->
    <div class="mb-3 text-end">
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalJugador">
            ➕ Nuevo Jugador
        </button>

        <button class="btn btn-primary" onclick="cargarJugadores()">
            🔄 Listar jugadores
        </button>
    </div>


    <div class="card shadow">
        <div class="card-body">

            <table class="table table-hover table-striped">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Activo</th>
                </tr>
                </thead>

                <tbody id="tabla-jugadores"></tbody>

            </table>

        </div>
    </div>

    <a href="index.html" class="btn btn-secondary mt-3">
        ⬅ Volver al Menú Principal
    </a>

</div>


<!-- MODAL NUEVO JUGADOR -->
<div class="modal fade" id="modalJugador">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Nuevo Jugador</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form id="formJugador">

                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Teléfono</label>
                        <input type="text" id="telefono" class="form-control">
                    </div>

                </form>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="guardarJugador()">Guardar</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/jugadores.js"></script>

</body>
</html>
